name: WeatherAI daily uptime monitor

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weatherai-uptime-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WEATHER_AI_API_KEY: ${{ secrets.WEATHER_AI_API_KEY }}
      WEATHER_AI_BASE_URL: ${{ vars.WEATHER_AI_BASE_URL || 'https://api.weather-ai.co' }}
      WEATHER_AI_PLAN: ${{ vars.WEATHER_AI_PLAN || 'free' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run only the one-request monitoring test
        run: npm run test:monitor
      - name: Upload monitoring results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uptime-monitor-results
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
