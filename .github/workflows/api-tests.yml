name: WeatherAI API quality pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_ai_tests:
        description: Run the opt-in AI summary checks (consumes AI quota)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: weatherai-api-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-quality:
    name: API quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      WEATHER_AI_API_KEY: ${{ secrets.WEATHER_AI_API_KEY }}
      WEATHER_AI_BASE_URL: ${{ vars.WEATHER_AI_BASE_URL || 'https://api.weather-ai.co' }}
      WEATHER_AI_PLAN: ${{ vars.WEATHER_AI_PLAN || 'free' }}
      RUN_AI_TESTS: ${{ inputs.run_ai_tests && 'true' || 'false' }}

    outputs:
      has-key: ${{ steps.secret.outputs.has_key }}
      pages-ready: ${{ steps.pages-upload.outcome == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deterministic dependencies
        run: npm ci

      - name: Detect live-test secret without printing it
        id: secret
        shell: bash
        run: |
          if [[ -n "$WEATHER_AI_API_KEY" ]]; then
            echo "HAS_WEATHER_AI_KEY=true" >> "$GITHUB_ENV"
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "HAS_WEATHER_AI_KEY=false" >> "$GITHUB_ENV"
            echo "has_key=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Prepare evidence directories
        if: always()
        run: mkdir -p blob-report k6-results

      - name: Unit tests
        if: always()
        env:
          PLAYWRIGHT_BLOB_OUTPUT_FILE: blob-report/unit.zip
        run: npm run test:unit -- --reporter=blob

      - name: Smoke tests
        if: always() && env.HAS_WEATHER_AI_KEY == 'true'
        env:
          PLAYWRIGHT_BLOB_OUTPUT_FILE: blob-report/smoke.zip
        run: npm run test:smoke -- --reporter=blob

      - name: Functional tests
        if: always() && env.HAS_WEATHER_AI_KEY == 'true'
        env:
          PLAYWRIGHT_BLOB_OUTPUT_FILE: blob-report/functional.zip
        run: npm run test:functional -- --reporter=blob

      - name: Contract tests
        if: always() && env.HAS_WEATHER_AI_KEY == 'true'
        env:
          PLAYWRIGHT_BLOB_OUTPUT_FILE: blob-report/contract.zip
        run: npm run test:contract -- --reporter=blob

      - name: Negative tests
        if: always() && env.HAS_WEATHER_AI_KEY == 'true'
        env:
          PLAYWRIGHT_BLOB_OUTPUT_FILE: blob-report/negative.zip
        run: npm run test:negative -- --reporter=blob

      - name: Data-quality tests
        if: always() && env.HAS_WEATHER_AI_KEY == 'true'
        env:
          PLAYWRIGHT_BLOB_OUTPUT_FILE: blob-report/data-quality.zip
        run: npm run test:data-quality -- --reporter=blob

      - name: Endpoint-consistency tests
        if: always() && env.HAS_WEATHER_AI_KEY == 'true'
        env:
          PLAYWRIGHT_BLOB_OUTPUT_FILE: blob-report/consistency.zip
        run: npm run test:consistency -- --reporter=blob

      - name: Accuracy comparison
        if: always() && env.HAS_WEATHER_AI_KEY == 'true'
        env:
          PLAYWRIGHT_BLOB_OUTPUT_FILE: blob-report/accuracy.zip
        run: npm run test:accuracy -- --reporter=blob

      - name: Verify exact Playwright blob report set
        id: blob-verification
        if: always()
        shell: bash
        run: |
          expected=(unit.zip)
          if [[ "$HAS_WEATHER_AI_KEY" == "true" ]]; then
            expected+=(smoke.zip functional.zip contract.zip negative.zip data-quality.zip consistency.zip accuracy.zip)
          fi

          mapfile -t actual < <(find blob-report -maxdepth 1 -type f -name '*.zip' -printf '%f\n' | sort)
          if [[ "${#actual[@]}" -ne "${#expected[@]}" ]]; then
            echo "ERROR: expected ${#expected[@]} blob reports, found ${#actual[@]}."
            printf 'Found: %s\n' "${actual[@]}"
            exit 1
          fi

          for report in "${expected[@]}"; do
            if [[ ! -f "blob-report/$report" ]]; then
              echo "ERROR: missing blob-report/$report"
              exit 1
            fi
          done

          echo "Verified ${#expected[@]} expected Playwright blob reports."

      - name: Merge Playwright reports
        if: always() && steps.blob-verification.outcome == 'success'
        run: npx playwright merge-reports --config=playwright.config.ts blob-report

      - name: Verify merged HTML report
        id: html-verification
        if: always() && steps.blob-verification.outcome == 'success'
        shell: bash
        run: |
          if [[ ! -f "playwright-report/index.html" ]]; then
            echo "ERROR: playwright-report/index.html was not generated."
            exit 1
          fi
          echo "Merged Playwright HTML report is available."

      - name: Generate evidence-based quality summary
        if: always() && steps.html-verification.outcome == 'success'
        run: npm run report:summary

      - name: Setup k6
        if: always() && env.HAS_WEATHER_AI_KEY == 'true'
        uses: grafana/setup-k6-action@v1

      - name: Bounded one-request k6 smoke
        if: always() && env.HAS_WEATHER_AI_KEY == 'true'
        run: npm run perf:smoke

      - name: Upload k6 performance evidence
        if: always() && env.HAS_WEATHER_AI_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: k6-smoke-results
          path: k6-results/smoke-summary.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload Playwright HTML report
        if: always() && steps.html-verification.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: playwright-report/
          if-no-files-found: error
          retention-days: 30

      - name: Upload JUnit and quality results
        if: always() && steps.html-verification.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: machine-readable-results
          path: |
            test-results/results.xml
            test-results/results.json
            quality-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Stage report for GitHub Pages
        id: pages-upload
        if: >
          always() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          env.HAS_WEATHER_AI_KEY == 'true' &&
          steps.html-verification.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report/

  deploy-report:
    name: Publish Playwright report
    needs: api-quality
    if: >
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.api-quality.outputs.has-key == 'true' &&
      needs.api-quality.outputs.pages-ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Playwright report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
