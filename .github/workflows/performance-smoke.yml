name: WeatherAI k6 performance smoke

on:
  push:
    branches: [main]
    paths:
      - 'performance/**'
      - '.github/workflows/performance-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weatherai-performance-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  one-request-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WEATHER_AI_API_KEY: ${{ secrets.WEATHER_AI_API_KEY }}
      WEATHER_AI_BASE_URL: ${{ vars.WEATHER_AI_BASE_URL || 'https://api.weather-ai.co' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: grafana/setup-k6-action@v1
      - name: Run exactly one k6 request
        run: npm run perf:smoke
      - name: Upload k6 performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-smoke-results
          path: k6-results/smoke-summary.json
          if-no-files-found: error
          retention-days: 30
